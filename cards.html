<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Song Cards | My Playlist</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1><i class="fa fa-music"></i> My Playlist</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="playlist.html">Playlist</a>
      <a href="cards.html" class="active">Song Cards</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <h2>My Songs as Cards</h2>
    <p>This page shows the same songs as the Playlist page. This time they are made with a Handlebars template.</p>

    <section class="toolbar">
      <form id="searchForm">
        <input type="text" name="search" placeholder="Search by title or artist" required>
        <button type="submit"><i class="fa fa-search"></i> Search</button>
        <button type="button" id="showAll">Show All</button>
      </form>
      <div class="filter">
        <label for="genreFilter">Genre</label>
        <select id="genreFilter">
          <option value="All">All</option>
          <option value="Pop">Pop</option>
          <option value="Rock">Rock</option>
          <option value="Hip Hop">Hip Hop</option>
          <option value="Dance">Dance</option>
          <option value="Indie">Indie</option>
        </select>
      </div>
      <button id="toggle"><i class="fa fa-plus"></i> Add a Song</button>
    </section>

    <p id="message"></p>

    <section id="songCards" class="song-cards">
    </section>

    <dialog>
      <header class="modal__title">
        <h2>Add a Song<span id="close"><i class="fa fa-close"></i></span></h2>
      </header>
      <form id="songForm">
        <div class="form-row">
          <label for="songTitle">Title</label>
          <input type="text" name="songTitle" id="songTitle" required>
        </div>
        <div class="form-row">
          <label for="artist">Artist</label>
          <input type="text" name="artist" id="artist" required>
        </div>
        <div class="form-row">
          <label for="genre">Genre</label>
          <select name="genre" id="genre" required>
            <option value="">Select a Genre</option>
            <option value="Pop">Pop</option>
            <option value="Rock">Rock</option>
            <option value="Hip Hop">Hip Hop</option>
            <option value="Dance">Dance</option>
            <option value="Indie">Indie</option>
          </select>
        </div>
        <div class="form-row">
          <label for="songLength">Length</label>
          <input type="text" name="songLength" id="songLength" placeholder="e.g. 3:45" required>
        </div>
        <div class="form-row">
          <label for="year">Year</label>
          <input type="number" name="year" id="year" min="1900" required>
        </div>
        <div class="form-row">
          <label>Rating</label>
          <div class="radios">
            <input type="radio" name="rating" id="r1" value="1"><label for="r1">1</label>
            <input type="radio" name="rating" id="r2" value="2"><label for="r2">2</label>
            <input type="radio" name="rating" id="r3" value="3" checked><label for="r3">3</label>
            <input type="radio" name="rating" id="r4" value="4"><label for="r4">4</label>
            <input type="radio" name="rating" id="r5" value="5"><label for="r5">5</label>
          </div>
        </div>
        <div class="form-row">
          <label for="favourite">Favourite?</label>
          <input type="checkbox" name="favourite" id="favourite">
        </div>
        <button type="submit">Add a New Song</button>
        <button type="reset">Clear the Info</button>
      </form>
    </dialog>
  </main>

  <footer>
    <p>&copy; <span id="footerYear"></span> Ugnius Liutinskis</p>
  </footer>

  <!-- Handlebars template for the song cards -->
  <script id="songs-template" type="text/x-handlebars-template">
    {{#unless this}}
      <h3>No songs found. Try another search.</h3>
    {{else}}
      {{#each this}}
        <div class="song-card">
          <h3>{{title}}</h3>
          <p class="artist">{{artist}}</p>
          <p><i class="fa fa-headphones"></i> {{genre}}</p>
          <p><i class="fa fa-clock-o"></i> {{length}} | {{year}}</p>
          <p><i class="fa fa-star"></i> {{rating}} / 5</p>
          {{#if favourite}}
            <p class="fav"><i class="fa fa-heart"></i> One of my favourites</p>
          {{else}}
            <p class="not-fav">Not a favourite</p>
          {{/if}}
          <button data-id="{{id}}">Delete</button>
        </div>
      {{/each}}
    {{/unless}}
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>
  <script src="js/songs.js"></script>
  <script src="js/cards.js"></script>
</body>
</html>
